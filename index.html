<script>
'use strict';
addEventListener('error',e=>{const d=document.getElementById('err');d.style.display='block';d.textContent='ERR: '+e.message+'  @'+(e.lineno||'?');});
const $=id=>document.getElementById(id);
const cvs=$('c'),gl=cvs.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
function err(m){const d=$('err');d.style.display='block';d.textContent=m;}
if(!gl){err('需要支持 WebGL2 的浏览器');throw 'no webgl2';}
const extF=gl.getExtension('EXT_color_buffer_float');
const TAU=Math.PI*2;

/* ---------- mat/vec ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const nrm=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l];};
const lp3=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const ss=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const I4=()=>{const m=new Float32Array(16);m[0]=m[5]=m[10]=m[15]=1;return m;};
const MUL=(a,b)=>{const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;};
const RY=a=>{const c=Math.cos(a),s=Math.sin(a),m=I4();m[0]=c;m[2]=-s;m[8]=s;m[10]=c;return m;};
const RZ=a=>{const c=Math.cos(a),s=Math.sin(a),m=I4();m[0]=c;m[1]=s;m[4]=-s;m[5]=c;return m;};
const TT=(x,y,z)=>{const m=I4();m[12]=x;m[13]=y;m[14]=z;return m;};
const PERSP=(f,a,n,fa)=>{const t=1/Math.tan(f/2),o=new Float32Array(16);o[0]=t/a;o[5]=t;o[10]=(fa+n)/(n-fa);o[11]=-1;o[14]=2*fa*n/(n-fa);return o;};
const LOOK=(e,c)=>{const z=nrm(sub(e,c)),x=nrm(cross([0,1,0],z)),y=cross(z,x);
 return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1]);};

/* ---------- geometry ---------- */
const G=()=>({p:[],n:[],i:[]});
function xf(g,m){
 for(let i=0;i<g.p.length;i+=3){const x=g.p[i],y=g.p[i+1],z=g.p[i+2];
  g.p[i]=m[0]*x+m[4]*y+m[8]*z+m[12];g.p[i+1]=m[1]*x+m[5]*y+m[9]*z+m[13];g.p[i+2]=m[2]*x+m[6]*y+m[10]*z+m[14];}
 for(let i=0;i<g.n.length;i+=3){const x=g.n[i],y=g.n[i+1],z=g.n[i+2];
  const nx=m[0]*x+m[4]*y+m[8]*z,ny=m[1]*x+m[5]*y+m[9]*z,nz=m[2]*x+m[6]*y+m[10]*z,l=Math.hypot(nx,ny,nz)||1;
  g.n[i]=nx/l;g.n[i+1]=ny/l;g.n[i+2]=nz/l;}
 return g;}
function merge(...gs){const o=G();let b=0;for(const g of gs){o.p.push(...g.p);o.n.push(...g.n);for(const t of g.i)o.i.push(t+b);b+=g.p.length/3;}return o;}

/* parametric surface, normals via finite differences */
function surf(fn,nu,nv,o={}){
 const g=G(),e=1e-3;
 const at=(u,v)=>fn(Math.min(1,Math.max(0,u)),Math.min(1,Math.max(0,v)));
 for(let i=0;i<=nu;i++)for(let j=0;j<=nv;j++){
  const u=i/nu,v=j/nv,c=at(u,v);
  const du=sub(at(u+e,v),at(u-e,v)),dv=sub(at(u,v+e),at(u,v-e));
  let n=cross(du,dv);const l=Math.hypot(n[0],n[1],n[2]);
  n=l>1e-9?[n[0]/l,n[1]/l,n[2]/l]:[0,1,0];
  if(o.flip)n=[-n[0],-n[1],-n[2]];
  g.p.push(c[0],c[1],c[2]);g.n.push(n[0],n[1],n[2]);}
 for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){
  const a=i*(nv+1)+j,b=a+nv+1;
  g.i.push(a,b,a+1,a+1,b,b+1);}
 return g;}

/* lathe: crisp edges (duplicated ring verts per profile segment) */
function lathe(pts,seg){
 const g=G();
 for(let s=0;s<pts.length-1;s++){
  const r0=pts[s][0],y0=pts[s][1],r1=pts[s+1][0],y1=pts[s+1][1];
  const dr=r1-r0,dy=y1-y0,l=Math.hypot(dr,dy)||1,nr=dy/l,ny=-dr/l,b=g.p.length/3;
  for(let i=0;i<=seg;i++){const a=i/seg*TAU,c=Math.cos(a),s2=Math.sin(a);
   g.p.push(r0*c,y0,r0*s2,r1*c,y1,r1*s2);g.n.push(nr*c,ny,nr*s2,nr*c,ny,nr*s2);}
  for(let i=0;i<seg;i++)g.i.push(b+i*2,b+i*2+1,b+i*2+2,b+i*2+1,b+i*2+3,b+i*2+2);}
 return g;}

function ball(r,seg){const p=[];for(let i=0;i<=8;i++){const a=-Math.PI/2+i/8*Math.PI;p.push([r*Math.cos(a),r*Math.sin(a)]);}return lathe(p,seg);}

/* n-gon prism with chamfered ends (hex heads/nuts) */
function ngon(n,r,y0,y1,ch){
 const g=G();
 const ring=(rr,y)=>{const a=[];for(let i=0;i<n;i++){const t=i/n*TAU;a.push([rr*Math.cos(t),y,rr*Math.sin(t)]);}return a;};
 const r0=ring(r-ch*1.5,y0),r1=ring(r,y0+ch),r2=ring(r,y1-ch),r3=ring(r-ch*1.5,y1);
 const bands=[[r0,r1],[r1,r2],[r2,r3]];
 for(const[A,B]of bands){
  const dR=(Math.hypot(B[0][0],B[0][2])-Math.hypot(A[0][0],A[0][2])),
        dY=B[0][1]-A[0][1],l=Math.hypot(dR,dY)||1,nr=dY/l,ny=-dR/l;
  for(let i=0;i<n;i++){const j=(i+1)%n,am=(i+.5)/n*TAU,b=g.p.length/3;
   const nx=nr*Math.cos(am),nz=nr*Math.sin(am);
   g.p.push(...A[i],...B[i],...B[j],...A[j]);
   for(let k=0;k<4;k++)g.n.push(nx,ny,nz);
   g.i.push(b,b+1,b+2,b,b+2,b+3);}}
 const cap=(R,y,up)=>{const c=g.p.length/3;
  g.p.push(0,y,0);g.n.push(0,up?1:-1,0);
  for(let i=0;i<n;i++){g.p.push(...R[i]);g.n.push(0,up?1:-1,0);}
  for(let i=0;i<n;i++){const j=(i+1)%n;up?g.i.push(c,c+1+i,c+1+j):g.i.push(c,c+1+j,c+1+i);}};
 cap(r0,y0,false);cap(r3,y1,true);
 return g;}

function box(sx,sy,sz){
 const g=G(),x=sx/2,y=sy/2,z=sz/2;
 const F=(c0,c1,c2,c3,n)=>{const b=g.p.length/3;g.p.push(...c0,...c1,...c2,...c3);
  for(let k=0;k<4;k++)g.n.push(...n);g.i.push(b,b+1,b+2,b,b+2,b+3);};
 F([-x,-y,-z],[x,-y,-z],[x,-y,z],[-x,-y,z],[0,-1,0]);
 F([-x,y,-z],[-x,y,z],[x,y,z],[x,y,-z],[0,1,0]);
 F([-x,-y,-z],[-x,-y,z],[-x,y,z],[-x,y,-z],[-1,0,0]);
 F([x,-y,-z],[x,y,-z],[x,y,z],[x,-y,z],[1,0,0]);
 F([-x,-y,-z],[-x,y,-z],[x,y,-z],[x,y,-z],[0,0,-1]);
 F([-x,-y,z],[x,-y,z],[x,y,z],[-x,y,z],[0,0,1]);
 return g;}

/* extruded annulus: outer profile fn(angle)->r, inner circle, chamfer rings [[scale,y]] */
function annulus(outR,inR,rings,na){
 const rv=v=>{const t=v*(rings.length-1),i=Math.min(rings.length-2,Math.floor(t)),f=t-i;
  return{s:rings[i][0]+(rings[i+1][0]-rings[i][0])*f,y:rings[i][1]+(rings[i+1][1]-rings[i][1])*f};};
 const wall=(rf,flip)=>surf((u,v)=>{const a=u*TAU,r=rf(a),g=rv(v);
  return[r*g.s*Math.cos(a),g.y,r*g.s*Math.sin(a)];},na,(rings.length-1)*3,{flip});
 const cap=(y,s,up)=>surf((u,v)=>{const a=u*TAU,r=(inR+(outR(a)-inR)*v)*s;
  return[r*Math.cos(a),y,r*Math.sin(a)];},na,4,{flip:!up});
 const L=rings.length-1;
 return merge(wall(outR,false),wall(()=>inR,true),cap(rings[L][1],rings[L][0],true),cap(rings[0][1],rings[0][0],false));}

/* ---------- parts ---------- */
function buildGear(){
 const T=16,Rt=2.02,Rr=1.6,Ri=1.28;
 const prof=a=>{const p=((a/(TAU/T))%1+1)%1;
  const rise=ss(.34,.46,p),fall=1-ss(.56,.68,p);
  return Rr+(Rt-Rr)*Math.min(rise,fall);};
 const rim=annulus(prof,Ri,[[.9,0],[1,.07],[1,.48],[.9,.55]],T*12);
 const hub=annulus(()=>.56,.30,[[.86,.42],[1,.5],[1,.96],[.86,1.05]],64);
 const boreFloor=lathe([[0,.46],[.3,.46],[.3,.42]],48);
 const sp=[];
 for(let k=0;k<5;k++){const s=box(.82,.36,.34);xf(s,MUL(RY(k/5*TAU),TT(.9,0,0)));xf(s,TT(0,.275,0));sp.push(s);}
 return merge(rim,hub,boreFloor,...sp);}

function buildBolt(){
 const head=merge(ngon(6,.98,2.78,3.42,.09),
  lathe([[0,2.6],[1.08,2.6],[1.16,2.66],[1.16,2.74],[1.06,2.8],[0,2.8]],64));
 const shaft=lathe([[0,.02],[.26,.02],[.55,.24],[.55,2.7],[.5,2.76],[0,2.76]],48);
 const p=.3,yA=.5,yB=2.55,turns=(yB-yA)/p,du=1/Math.ceil(turns*40);
 const hel=(u,rr,dy)=>{const a=u*turns*TAU,y=yA+u*(yB-yA)+dy;
  return[rr*Math.cos(a),y,rr*Math.sin(a)];};
 const amp=u=>ss(0,.06,u)*(1-ss(.94,1,u));
 const A=u=>hel(u,.52,-p*.3),B=u=>{const a=amp(u),h=hel(u,.52+.16*a,-p*.05*a);return h;},C=u=>hel(u,.52,p*.3);
 const f1=surf((u,v)=>lp3(A(u),B(u),v),Math.ceil(turns*40),2);
 const f2=surf((u,v)=>lp3(B(u),C(u),v),Math.ceil(turns*40),2);
 const val=surf((u,v)=>{const uu=u*(1-du);return lp3(C(uu),A(uu+du),v);},Math.ceil(turns*40),1);
 return merge(head,shaft,f1,f2,val);}

function buildImpeller(){
 const disc=lathe([[0,0],[1.82,0],[1.98,.06],[1.98,.15],[1.85,.21],[.62,.21],[.56,.27],[.56,.62],[.44,.74],[.3,.8],[0,.8]],80);
 const bore=lathe([[0,.5],[.16,.5],[.16,.82]],32);
 const NB=9,sN=26,bl=[];
 for(let b=0;b<NB;b++){
  const off=b/NB*TAU;
  const C=u=>{const r=.5+1.4*u,th=off+1.15*Math.pow(u,1.35);return[r*Math.cos(th),0,r*Math.sin(th)];};
  const Nr=u=>{const e=1e-3,a=C(Math.min(1,u+e)),c=C(Math.max(0,u-e)),tx=a[0]-c[0],tz=a[2]-c[2],l=Math.hypot(tx,tz)||1;return[-tz/l,0,tx/l];};
  const yHi=u=>.8-.42*u+.05*Math.sin(Math.PI*u),th=.07;
  const P=(u,v,s)=>{const c=C(u),n=Nr(u);return[c[0]+n[0]*th/2*s,.2+(yHi(u)-.2)*v,c[2]+n[2]*th/2*s];};
  bl.push(merge(
   surf((u,v)=>P(u,v,1),sN,6),surf((u,v)=>P(u,v,-1),sN,6,{flip:true}),
   surf((u,k)=>lp3(P(u,1,1),P(u,1,-1),k),sN,1),
   surf((k,v)=>lp3(P(1,v,1),P(1,v,-1),k),1,6),
   surf((k,v)=>lp3(P(0,v,1),P(0,v,-1),k),1,6)));}
 return merge(disc,bore,...bl);}

function buildFlange(){
 const LIFT=1.35;
 const shaft=xf(lathe([[0,-1.0],[.4,-1.0],[.45,-.94],[.45,1.82],[.4,1.9],[0,1.9]],72),TT(0,LIFT,0));
 const disc=lathe([[0,-.15],[1.5,-.15],[1.64,-.07],[1.64,.07],[1.5,.15],[0,.15]],96);
 const bolt=merge(
  ngon(6,.17,.05,.19,.03),
  lathe([[0,-.03],[.21,-.03],[.22,0],[.22,.05],[0,.05]],24),
  lathe([[0,-2.36],[.1,-2.36],[.1,-.03]],24),
  ngon(6,.165,-2.36,-2.24,.025));
 const discs=[{m:TT(0,LIFT+1.05,0),e:[0,1.45,0]},{m:TT(0,LIFT-1.05,0),e:[0,.7,0]}];
 const bolts=[];
 for(let k=0;k<8;k++){const a=k/8*TAU,x=1.32*Math.cos(a),z=1.32*Math.sin(a);
  bolts.push({m:TT(x,LIFT+1.05+.17,z),e:[x*.45,2.1,z*.45]});}
 return{shaft,disc,bolt,discs,bolts};}

function buildSpring(){
 const R=.78,wr=.115,coils=6.2,T=coils*TAU,midP=.72,N=1500;
 const pit=t=>wr*2.05+(midP-wr*2.05)*ss(0,2.8,t)*ss(T-2.8,T,t);
 const C=[];
 {let y=wr;for(let i=0;i<=N;i++){const t=i/N*T;C.push([R*Math.cos(t),y,R*Math.sin(t)]);if(i<N)y+=(pit(t)+pit(t+T/N))*.5/TAU*(T/N);}}
 const at=u=>C[Math.min(N,Math.max(0,Math.round(u*N)))];
 const fr=u=>{const e=1/N,a=at(Math.min(1,u+e)),b=at(Math.max(0,u-e));
  const Tg=nrm(sub(a,b));let Nv=cross([0,1,0],Tg);Nv=nrm(Nv);const B=cross(Tg,Nv);return[Nv,B];};
 const g=surf((u,ph)=>{const c=at(u),[Nv,B]=fr(u),a=ph*TAU;
  return[c[0]+(Nv[0]*Math.cos(a)+B[0]*Math.sin(a))*wr,
         c[1]+(Nv[1]*Math.cos(a)+B[1]*Math.sin(a))*wr,
         c[2]+(Nv[2]*Math.cos(a)+B[2]*Math.sin(a))*wr];},420,10);
 const cap0=xf(ball(wr,16),TT(C[0][0],C[0][1],C[0][2]));
 const cap1=xf(ball(wr,16),TT(C[N][0],C[N][1],C[N][2]));
 return merge(g,cap0,cap1);}

/* ---------- shaders ---------- */
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
 if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){err('SHADER: '+gl.getShaderInfoLog(o));console.error(s);}return o;}
function prog(v,f){const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,v));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,f));

  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),k=cam.dist*.0016;
  goal.tx-=cy*dx*k;goal.tz+=sy*dx*k;
  goal.ty+=dy*k;
 }else{
  goal.yaw-=dx*.0052;goal.pitch=Math.min(1.45,Math.max(.06,goal.pitch+dy*.004));}});
cvs.addEventListener('pointerup',()=>drag=null);
cvs.addEventListener('wheel',e=>{e.preventDefault();goal.dist=Math.min(26,Math.max(2.4,goal.dist*Math.exp(e.deltaY*.001)));},{passive:false});
cvs.addEventListener('dblclick',()=>{goal.yaw=.8;goal.pitch=.46;goal.dist=PARTS[part].dist;goal.tx=0;goal.ty=PARTS[part].ty;goal.tz=0;});
addEventListener('keydown',e=>{
 if(e.key>='1'&&e.key<='5')select(+e.key-1);
 if(e.key==='w'||e.key==='W'){wire=!wire;$('swWire').classList.toggle('on',wire);}});

/* ---------- render ---------- */
function setCommon(spinC,spinS,mir,shd){
 f1(PM,'uSC',spinC);f1(PM,'uSS',spinS);f1(PM,'uMir',mir);f1(PM,'uShd',shd);}
function matOf(m){f3(PM,'uAlb',m.mat.alb[0],m.mat.alb[1],m.mat.alb[2]);f1(PM,'uRough',m.mat.rough);f1(PM,'uMet',m.mat.met);}

let T0=performance.now();
function frame(now){
 const t=(now-T0)/1000,dt=Math.min(.05,(now-last)/1000||.016);last=now;
 resize();
 fpsN++;fpsT+=dt;if(fpsT>.5){fpsV=fpsN/fpsT;fpsN=0;fpsT=0;
  $('stats').textContent='FPS '+fpsV.toFixed(0)+'  ·  TRI '+(PARTS[part].tris/1000).toFixed(1)+'k  ·  '+(HDR?'HDR':'LDR')+'  ·  MSAA×4';}
 if(orbitOn)goal.yaw+=dt*.1;
 if(spinOn)spinA+=dt*.55;
 ringA1+=dt*.22;ringA2-=dt*.16;
 appearT=Math.min(1,appearT+dt*2.4);
 fade=Math.min(1,fade+dt*.8);
 exV+=(exT-exV)*Math.min(1,dt*6);
 const dk=Math.min(1,dt*7);
 for(const k of['yaw','pitch','dist','tx','ty','tz'])cam[k]+=(goal[k]-cam[k])*dk;
 const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
 const eye=[cam.tx+cam.dist*cp*Math.sin(cam.yaw),cam.ty+cam.dist*sp,cam.tz+cam.dist*cp*Math.cos(cam.yaw)];
 const view=LOOK(eye,[cam.tx,cam.ty,cam.tz]);
 const proj=PERSP(.7,W/H,.05,160);
 const apr=.82+.18*(1-Math.pow(1-appearT,3));
 const sC=Math.cos(spinA),sS=Math.sin(spinA);
 const px=H/(2*Math.tan(.35));
 const P=PARTS[part];

 /* dust drift */
 for(let i=0;i<NDUST;i++){dustP[i*3+1]+=dustS[i]*dt;dustP[i*3]+=Math.sin(t*.4+i)*dt*.05;
  if(dustP[i*3+1]>4.6){dustP[i*3+1]=0;dustP[i*3]=(Math.random()-.5)*13;dustP[i*3+2]=(Math.random()-.5)*13;}}
 gl.bindBuffer(gl.ARRAY_BUFFER,DUST.pb);gl.bufferSubData(gl.ARRAY_BUFFER,0,dustP);

 gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
 gl.viewport(0,0,W,H);
 gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT|gl.STENCIL_BUFFER_BIT);
 gl.disable(gl.DEPTH_TEST);gl.depthMask(false);
 gl.useProgram(PBG);gl.bindVertexArray(quadVAO);gl.drawArrays(gl.TRIANGLES,0,3);
 gl.enable(gl.DEPTH_TEST);gl.depthMask(true);

 gl.useProgram(PM);
 fm(PM,'uProj',proj);fm(PM,'uView',view);
 f3(PM,'uCam',eye[0],eye[1],eye[2]);
 f1(PM,'uFloorY',0);f1(PM,'uExpl',exV);f1(PM,'uApr',apr);
 f3(PM,'uPivot',0,P.ty,0);f1(PM,'uEnvI',envI);f1(PM,'uPx',px);

 /* 1 — mirrored reflection */
 setCommon(sC,sS,1,0);f1(PM,'uBias',0);f1(PM,'uGlow',0);
 for(const m of P.meshes){matOf(m);gl.bindVertexArray(m.gl.vao);
  gl.drawElementsInstanced(gl.TRIANGLES,m.gl.n,gl.UNSIGNED_INT,0,m.gl.ic);}

 /* 2 — floor */
 gl.depthMask(false);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
 gl.useProgram(PFL);
 fm(PFL,'uProj',proj);fm(PFL,'uView',view);f3(PFL,'uCam',eye[0],eye[1],eye[2]);
 gl.bindVertexArray(floorVAO);
 gl.drawElements(gl.TRIANGLES,FLG.i.length,gl.UNSIGNED_INT,0);
 gl.useProgram(PM);
 gl.depthMask(true);gl.disable(gl.BLEND);

 /* 3 — projected shadow (stencil: draw each pixel once) */
 setCommon(sC,sS,0,1);
 gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
 gl.enable(gl.STENCIL_TEST);
 gl.stencilFunc(gl.EQUAL,0,0xFF);gl.stencilOp(gl.KEEP,gl.KEEP,gl.INCR);
 for(const m of P.meshes){gl.bindVertexArray(m.gl.vao);
  gl.drawElementsInstanced(gl.TRIANGLES,m.gl.n,gl.UNSIGNED_INT,0,m.gl.ic);}
 gl.disable(gl.STENCIL_TEST);
 gl.disable(gl.BLEND);gl.depthMask(true);

 /* 4 — main pass */
 setCommon(sC,sS,0,0);
 for(const m of P.meshes){matOf(m);gl.bindVertexArray(m.gl.vao);
  gl.drawElementsInstanced(gl.TRIANGLES,m.gl.n,gl.UNSIGNED_INT,0,m.gl.ic);}

 /* glow rings */
 gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
 f1(PM,'uGlow',1);f1(PM,'uGA',.55);f1(PM,'uBias',0);
 f3(PM,'uGCol',.12,.55,.7);
 f1(PM,'uSC',Math.cos(ringA1));f1(PM,'uSS',Math.sin(ringA1));
 gl.bindVertexArray(RING1.lvao);
 gl.drawElementsInstanced(gl.LINES,RING1.ln,gl.UNSIGNED_INT,0,RING1.ic);
 f3(PM,'uGCol',.09,.3,.45);
 f1(PM,'uSC',Math.cos(ringA2));f1(PM,'uSS',Math.sin(ringA2));
 gl.bindVertexArray(RING2.lvao);
 gl.drawElementsInstanced(gl.LINES,RING2.ln,gl.UNSIGNED_INT,0,RING2.ic);

 /* wireframe overlay */
 if(wire){f1(PM,'uGlow',1);f1(PM,'uGA',.9);f1(PM,'uBias',.004);
  f3(PM,'uGCol',.35,1.15,1.5);
  f1(PM,'uSC',sC);f1(PM,'uSS',sS);
  gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(-2,-2);
  for(const m of P.meshes){gl.bindVertexArray(m.gl.lvao);
   gl.drawElementsInstanced(gl.LINES,m.gl.ln,gl.UNSIGNED_INT,0,m.gl.ic);}
  gl.disable(gl.POLYGON_OFFSET_FILL);f1(PM,'uBias',0);}

 /* dust */
 f1(PM,'uGlow',2);f1(PM,'uGA',.5);f1(PM,'uSC',1);f1(PM,'uSS',0);
 f3(PM,'uGCol',.35,.6,.75);
 gl.depthMask(false);
 gl.bindVertexArray(DUST.vao);
 gl.drawElementsInstanced(gl.POINTS,NDUST,gl.UNSIGNED_INT,0,1);
 gl.depthMask(true);
 gl.disable(gl.BLEND);

 /* gizmo corner viewport */
 const gs=Math.floor(96*DPR);
 gl.enable(gl.SCISSOR_TEST);
 gl.scissor(W-gs-14*DPR,14*DPR,gs,gs);
 gl.clear(gl.DEPTH_BUFFER_BIT);
 gl.viewport(W-gs-14*DPR,14*DPR,gs,gs);
 f1(PM,'uGlow',1);f1(PM,'uGA',.9);
 fm(PM,'uProj',PERSP(.55,1,.1,10));
 const gv=LOOK([eye[0]-cam.tx,eye[1]-cam.ty,eye[2]-cam.tz],[0,0,0]);
 fm(PM,'uView',gv);
 f1(PM,'uSC',1);f1(PM,'uSS',0);f1(PM,'uMir',0);f1(PM,'uShd',0);
 gl.bindVertexArray(AXES.lvao);
 f3(PM,'uGCol',.9,.3,.35);gl.drawElementsInstanced(gl.LINES,2,gl.UNSIGNED_INT,0,1);
 f3(PM,'uGCol',.35,.85,.5);gl.drawElementsInstanced(gl.LINES,2,gl.UNSIGNED_INT,8,1);
 f3(PM,'uGCol',.35,.6,.95);gl.drawElementsInstanced(gl.LINES,2,gl.UNSIGNED_INT,16,1);
 gl.disable(gl.SCISSOR_TEST);
 gl.viewport(0,0,W,H);
 fm(PM,'uProj',proj);fm(PM,'uView',view);

 /* resolve MSAA */
 gl.bindFramebuffer(gl.READ_FRAMEBUFFER,fbo);
 gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,fbR);
 gl.blitFramebuffer(0,0,W,H,0,0,W,H,gl.COLOR_BUFFER_BIT,gl.NEAREST);
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);

 /* bloom */
 let bAmt=0;
 if(bloomOn){
  bAmt=HDR?.75:.6;
  gl.disable(gl.DEPTH_TEST);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbA);
  gl.viewport(0,0,W>>2,H>>2);
  gl.useProgram(PBR);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texR);
  f1(PBR,'uTh',HDR?.85:.8);
  gl.bindVertexArray(quadVAO);gl.drawArrays(gl.TRIANGLES,0,3);
  gl.useProgram(PBL);
  for(let it=0;it<2;it++){
   gl.bindFramebuffer(gl.FRAMEBUFFER,fbB);gl.bindTexture(gl.TEXTURE_2D,texA);
   PBL.u.uDir&&gl.uniform2f(PBL.u.uDir,1/(W>>2),0);
   gl.drawArrays(gl.TRIANGLES,0,3);
   gl.bindFramebuffer(gl.FRAMEBUFFER,fbA);gl.bindTexture(gl.TEXTURE_2D,texB);
   PBL.u.uDir&&gl.uniform2f(PBL.u.uDir,0,1/(H>>2));
   gl.drawArrays(gl.TRIANGLES,0,3);}
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);}

 /* composite */
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);
 gl.viewport(0,0,W,H);
 gl.disable(gl.DEPTH_TEST);
 gl.useProgram(PCP);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texR);
 gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,texA);
 if(PCP.u.uT)gl.uniform1i(PCP.u.uT,0);
 if(PCP.u.uB)gl.uniform1i(PCP.u.uB,1);
 f1(PCP,'uBAmt',bAmt);f1(PCP,'uFade',fade);f1(PCP,'uTime',t%10);
 gl.bindVertexArray(quadVAO);gl.drawArrays(gl.TRIANGLES,0,3);
 gl.enable(gl.DEPTH_TEST);
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script>
